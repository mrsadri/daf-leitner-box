name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover scripts/stories/tests
      - run: python3 scripts/stories/build_stories.py --check
      - run: python3 scripts/build-edge-function.py --check
      - run: npm run check:edge
      - run: npm run test:edge
      - run: npm run lint
      - run: npm run db:types:check
      - run: npm run db:upgrade:check
      - run: npm run db:questions:check
      - run: npm run test:sql:isolated
      - run: npm test
      - run: npm run build
        env:
          # Include the signed-in application in the production bundle without real credentials.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
      - name: Prepare browser for acceptance tests
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PW_EXE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium-headless-shell
          fi
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install disposable PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Test schema, migration replay, and SQL assertions
        run: bash scripts/test-sql.sh /usr/lib/postgresql/16/bin
