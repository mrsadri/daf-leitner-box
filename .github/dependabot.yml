version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      supabase:
        patterns:
          - '@supabase/*'
      build-toolchain:
        patterns:
          - vite
          - '@vitejs/*'
          - '@tailwindcss/*'
          - tailwindcss
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
